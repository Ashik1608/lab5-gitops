apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lab5-dev

resources:
- ../../base
- migration-job.yaml

replicas:
- name: final-app
  count: 1

images:
- name: nginx
  newTag: "1.25"

configMapGenerator:
- name: final-app-config
  behavior: merge
  literals:
  - APP_ENV=development

patches:
- target:
    kind: ConfigMap
    name: final-app-config
  patch: |-
    - op: add
      path: /metadata/annotations
      value:
        argocd.argoproj.io/sync-wave: "-1"

- target:
    kind: Deployment
    name: final-app
  patch: |-
    - op: add
      path: /metadata/annotations
      value:
        argocd.argoproj.io/sync-wave: "1"
