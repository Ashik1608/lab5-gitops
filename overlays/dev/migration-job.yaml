apiVersion: batch/v1
kind: Job
metadata:
  name: database-migration
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "0"
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: migration
        image: busybox:1.36
        command:
        - sh
        - -c
        - 'echo "Running database migration for development"; sleep 5; echo "Migration complete"'
  backoffLimit: 1
